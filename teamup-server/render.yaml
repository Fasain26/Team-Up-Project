# Render Blueprint for the TeamUp backend.
# Push this file at server/render.yaml, then in Render: New + > Blueprint,
# point at your repo. Render reads this and provisions the service.
#
# You still set the SECRET env vars (DATABASE_URL, JWT secrets, Cloudinary,
# CLIENT_ORIGIN) in the Render dashboard — never commit secrets.

services:
  - type: web
    name: teamup-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # The rest are set in the dashboard (marked sync:false so Render asks):
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
